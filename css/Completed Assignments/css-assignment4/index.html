<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./style.css">
    <title>Using Icons in HTML</title>
</head>
<body>
    <div class="container">
        <aside>
            <figure>
                <img class="profile-picture" src="./photo.jpeg" alt="Profile Picture">
            </figure>

            <h2 class="profile-name">Parwiz Zebaki</h2>
            <h3 class="profile-title">Full Stack Web Developer</h3>
            <hr class="divider">
            <nav class="sidebar-nav">
                <a class="nav-link about" href="#about"><i class="fas fa-user"></i><span> About</span></a>
                <a class="nav-link" href="#skills"><i class="fas fa-code"></i><span> Skills</span></a>
                <a class="nav-link" href="#projects"><i class="fas fa-briefcase"></i><span> Projects</span></a>
                <a class="nav-link" href="#contact"><i class="fas fa-envelope"></i><span> Contact</span></a>
            </nav>
        </aside>

        <main>
            <header>
                <h1 class="main-heading">About Me</h1>
                <hr class="line-after-about">
                <p class="about-p">I'm a web developer with a passion for creating engaging and user-friendly websites.</p>
            </header>

            <section>
                <h2 class="skills-heading">My Skills</h2>
                <span class="skill-item"><i class="fab fa-html5"></i> HTML</span>
                <span class="skill-item"><i class="fab fa-css3-alt"></i> CSS</span>
                <span class="skill-item"><i class="fab fa-js"></i> JavaScript</span>
                <span class="skill-item"><i class="fab fa-react"></i> React</span>
                <span class="skill-item"><i class="fab fa-node-js"></i> Node.js</span>
                <span class="skill-item"><i class="fab fa-git-alt"></i> Git</span>
            </section>

            <button class="btn">Let's Connect <i class="fa-solid fa-arrow-right-long"></i></button>
        </main>

    </div>
</body>
</html>
