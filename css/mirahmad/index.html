<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Table</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Level 1 — Basic HTML Table</h1>

    <p>Simple student information table</p>

    <div class="container">

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Score</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Ahmad</td>
                    <td>B</td>
                    <td>88</td>
                </tr>

                <tr>
                    <td>Hassan</td>
                    <td>A</td>
                    <td>92</td>
                </tr>

                <tr>
                    <td>Abdul khaier</td>
                    <td>C</td>
                    <td>76</td>
                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
