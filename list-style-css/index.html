<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>List-style-Css</title>
</head>
<body>
    <h5>Unordered list</h5>
    <ul>
        <li>Rice</li>
        <li>Steak</li>
        <li>Pizza</li>
        <li>Burger</li>
    </ul>
    <h5>Ordered list</h5>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Mysql</li>
        <li>MongoDB</li>
    </ol>
</body>
</html>
